<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe - Game</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background-color: grey;
    }
    .game-mode-buttons {
      margin-bottom: 20px;
    }
    .game-mode-buttons button {
      margin-right: 10px;
      padding: 8px 16px;
      cursor: pointer;
    }
    .ai-personality-selector {
      margin-top: 20px;
      margin-bottom: 10px;
    }
    .ai-personality-selector button {
      margin-right: 10px;
      padding: 6px 12px;
      cursor: pointer;
      background-color: #f0f0f0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #ai-personality-message {
      font-style: italic;
      color: #555;
      margin-top: 5px;
      margin-bottom: 10px;
      min-height: 20px;
    }
  </style>
  <script>
    // Show or hide AI personality selector based on game mode
    function updatePersonalitySelectorVisibility() {
      const selector = document.getElementById('ai-personality-selector');
      // Show selector only if in AI mode
      selector.style.display = isVsAI ? 'block' : 'none';
    }
  </script>
</head>
<body>
  <div class="game-container">
    <h2>Tic Tac Toe</h2>
    
    <div class="game-mode-buttons">
      <button onclick="startVsPlayer()">Player vs Player</button>
      <button onclick="startVsAI('easy')">Player vs AI (Easy)</button>
      <button onclick="startVsAI('medium')">Player vs AI (Medium)</button>
      <button onclick="startVsAI('impossible')">Player vs AI (Impossible)</button>
    </div>
    
    <div class="ai-personality-selector" id="ai-personality-selector">
      <button onclick="setAIPersonality('funny')">Funny AI</button>
      <button onclick="setAIPersonality('mean')">Mean AI</button>
      <button onclick="setAIPersonality('encouraging')">Encouraging AI</button>
    </div>
    
    <p id="ai-personality-message"></p>
    
    <h3 id="status-message">Player X's Turn</h3>

    <div id="board" class="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>
    
    <br>
      <button onclick="resetGame()" id="reset-button" style="display: none;">Play Again</button>
      <button onclick="handleLogout()">Logout</button>
      <button onclick="window.location.href='/history.html'">View Past Games</button>
    </div>

  <script src="main.js"></script>
</body>
</html>
